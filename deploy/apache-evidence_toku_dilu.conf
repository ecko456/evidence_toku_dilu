# Evidence toku dílů na /evidence_toku_dilu/. Vlastní kód, data i přihlášení;
# ostatních aplikací na serveru (Trading Desk, Odměny) se tahle konfigurace nedotýká.
RedirectMatch 301 ^/evidence_toku_dilu$ /evidence_toku_dilu/
Alias /evidence_toku_dilu/ /var/www/evidence_toku_dilu/

<Directory /var/www/evidence_toku_dilu>
    Options -Indexes -FollowSymLinks
    AllowOverride None
    DirectoryIndex index.php
    Require all granted
    SetEnv ETD_DATA_DIR /var/lib/evidence_toku_dilu

    # Z webu jsou vidět jen index.php, api.php, api/v1/ a soubory ve static/.
    <FilesMatch "(^\.|\.(md|txt|zip|py|sh|ini|json|sqlite3|lock|log|bak|conf)$)">
        Require all denied
    </FilesMatch>
    <Files "router.php">
        Require all denied
    </Files>

    # Statické soubory servíruje Apache sám; i ony dostanou ochranné hlavičky.
    # PHP stránky si je nastavují samy (lib/etd.php).
    <IfModule mod_headers.c>
        <FilesMatch "\.(js|css|svg|png|ico)$">
            Header set X-Content-Type-Options "nosniff"
            Header set Referrer-Policy "no-referrer"
            Header set Cross-Origin-Resource-Policy "same-origin"
        </FilesMatch>
    </IfModule>

    <IfModule php_module>
        php_value post_max_size 2M
        php_value upload_max_filesize 1M
    </IfModule>
</Directory>

# API pro IT: api/v1/last, api/v1/history… obslouží api/v1/index.php (mod_dir, bez mod_rewrite).
# Hlavička Authorization s klíčem musí projít až do PHP.
<Directory /var/www/evidence_toku_dilu/api/v1>
    FallbackResource /evidence_toku_dilu/api/v1/index.php
    CGIPassAuth On
</Directory>

# Knihovny, nástroje, testy a skryté adresáře se z webu nečtou vůbec.
<DirectoryMatch "^/var/www/evidence_toku_dilu/(\.[^/]*|data|lib|bin|tests|deploy)(/|$)">
    Require all denied
</DirectoryMatch>

<Directory /var/lib/evidence_toku_dilu>
    Require all denied
</Directory>
